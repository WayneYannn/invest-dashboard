name: 定时更新

on:
  schedule:
    - cron: '30 15 * * *'   # 每日定时抓取并部署
    - cron: '0 1 1 * *'     # 每月1日额外推送提醒
  workflow_dispatch:        # 手动触发（在 Actions 页面点 Run workflow）

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取数据
        run: python scripts/fetch_data.py

      - name: 提交 auto.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto.json
          git commit -m "chore: 自动更新基金净值/金价 [skip ci]" || echo "no-change"
          git push || echo "push-skipped"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  push-wechat:
    needs: update
    if: github.event.schedule == '0 1 1 * *'
    runs-on: ubuntu-latest
    steps:
      - name: 推送微信提醒（Server酱）
        env:
          SCKEY: ${{ secrets.SCKEY }}
        run: |
          if [ -z "$SCKEY" ]; then
            echo "未配置 SCKEY，跳过微信推送"
            exit 0
          fi
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          URL="https://${OWNER}.github.io/${REPO}/"
          TITLE="📊 月度检查提醒"
          DESP="本月该查看看板了。%0A%0A待办：%0A1. 确认自动更新的数据%0A2. 手动维护月度指标%0A3. 按信号执行操作%0A%0A👉 [点击打开看板](${URL})"
          if [ ${#SCKEY} -gt 30 ]; then
            # 新 Server酱（SENDKEY）
            curl -s -X POST "https://sctapi.ftqq.com/${SCKEY}.send" \
              --data-urlencode "title=${TITLE}" \
              --data-urlencode "desp=${DESP}"
          else
            # 旧 Server酱（SCKEY）
            curl -s "https://sc.ftqq.com/${SCKEY}.send?title=${TITLE}&desp=${DESP}"
          fi
          echo "微信推送已发送"
